# Render Blueprint for Resume Matcher — one-click Docker deploy (FREE tier).
#
# Deploy: Render Dashboard → New → Blueprint → select this repo/branch.
# Render will prompt for LLM_API_KEY (marked sync: false below).
#
# Notes:
# - The app listens on Render's injected PORT automatically (see docker/start.sh).
# - FRONTEND_BASE_URL defaults to Render's RENDER_EXTERNAL_URL for CORS.
# - Persistence is via MongoDB (MONGODB_URI below, e.g. a free Atlas cluster).
#   Without it the app falls back to SQLite on Render's ephemeral filesystem
#   and all data is wiped on every restart/redeploy.
# - FREE tier services sleep after 15 min idle (~1 min to wake up).
# - Alternative to MongoDB: upgrade to Starter+ (set `plan: starter`) and add
#   a disk so the local SQLite file persists:
#     disk:
#       name: resume-data
#       mountPath: /app/backend/data
#       sizeGB: 1
services:
  - type: web
    name: resume-matcher
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_LLM
        value: WARNING
      - key: LLM_PROVIDER
        value: openai
      # LLM_MODEL and LLM_API_BASE intentionally omitted: the backend defaults
      # apply when unset. Add them in the dashboard if you need overrides
      # (e.g. another provider/model or an Ollama base URL).
      - key: LLM_API_KEY
        sync: false
      # MongoDB connection string (Atlas: Database → Connect → Drivers).
      # When set, all app data lives in MongoDB instead of local SQLite.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: resume_matcher
